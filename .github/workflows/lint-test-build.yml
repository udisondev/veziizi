name: Lint, Test & Build

on:
  workflow_call:

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx vue-tsc --noEmit
        working-directory: frontend

  build-frontend:
    name: Build Frontend
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  test:
    name: Test
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veziizi
          POSTGRES_PASSWORD: veziizi
          POSTGRES_DB: veziizi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veziizi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://veziizi:veziizi@localhost:5432/veziizi?sslmode=disable
      SESSION_SECRET: test-secret-32-bytes-key-padding
      SESSION_ADMIN_SECRET: test-admin-secret-32-bytes-pad00
      APP_ENV: development
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -count=1 ./backend/internal/...

  test-e2e:
    name: E2E Test
    needs: [lint-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # E2E поднимают Postgres и Redis сами через testcontainers —
      # внешние services и env не нужны (см. backend/e2e/setup/).
      - name: Run E2E tests
        run: go test -v -count=1 -p=1 -timeout 20m ./backend/e2e/tests/...

  build:
    name: Build Backend
    needs: [test, test-e2e, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build all binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/api ./backend/cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/telegram-bot ./backend/cmd/telegram-bot
          # Список синхронизирован с WORKERS в Taskfile.yml
          for worker in forwarder members invitations pending-organizations organizations freight-requests review-receiver review-analyzer reviews-projection review-activator fraudster-handler notification-dispatcher telegram-sender email-sender support-tickets support-tickets-notifier rate-limiter-cleanup dedup-cleanup vehicles; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "bin/worker-${worker}" "./backend/cmd/workers/${worker}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: bin/
          retention-days: 3
