name: Merge Request

on:
  pull_request:
    branches: [staging]

concurrency:
  group: mr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    uses: ./.github/workflows/lint-test-build.yml

  review:
    name: Claude Code Review
    needs: lint-test-build
    runs-on: ubuntu-latest
    environment: claude-review
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior code reviewer for Veziizi — a B2B logistics platform.
            Tech stack: Go 1.23+ backend (DDD, Event Sourcing, watermill, pgx, squirrel), Vue 3 + TypeScript frontend (Tailwind, Pinia), PostgreSQL.

            Review this PR. Check for real issues only:

            **Go:** errors swallowed, SQL injection, race conditions, nil dereference, resource leaks, missing context propagation
            **Vue/TS:** reactive state misuse, unhandled API errors, XSS vectors, unsafe `any` casts
            **SQL:** backward-incompatible changes, missing indexes, NOT NULL without DEFAULT
            **General:** hardcoded secrets, debug code left in

            CRITICAL rules:
            - ONLY comment on code actually changed in this PR.
            - Do NOT invent names, paths, or issues. If <80% confident, skip it.
            - NEVER suggest improvements — only real bugs, security issues, or correctness problems.
            - Fewer high-confidence comments > many speculative ones.

            Use `mcp__github_inline_comment__create_inline_comment` for specific code issues.
            Use `gh pr comment` for general observations.
            If the PR is clean, post a brief comment: "PR looks good, no issues found."

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
