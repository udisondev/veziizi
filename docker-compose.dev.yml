# Dev override: `task up` starts Postgres + Redis
# Full Docker dev: `task dev:docker` (--profile docker-dev)

x-dev-env: &dev-env
  APP_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgres://veziizi:veziizi@postgres:5432/veziizi?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  HTTP_ADDR: ":8080"
  SESSION_SECRET: dev-secret-not-for-production!!
  SESSION_ADMIN_SECRET: dev-admin-secret-not-for-prod!
  SESSION_NAME: veziizi_session
  SESSION_ADMIN_NAME: veziizi_admin_session
  SESSION_MAX_AGE: "86400"
  APP_BASE_URL: http://localhost:5173
  EMAIL_ENABLED: "false"
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_BOT_USERNAME: veziizi_bot
  METRICS_ENABLED: "true"
  METRICS_ADDR: ":9090"

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: veziizi
      POSTGRES_PASSWORD: veziizi
      POSTGRES_DB: veziizi

  redis:
    ports:
      - "6379:6379"

  api:
    profiles: [docker-dev]
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      <<: *dev-env

  frontend:
    profiles: [docker-dev]
    ports:
      - "80:80"

  telegram-bot:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-forwarder:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-members:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-invitations:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-pending-organizations:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-organizations:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-freight-requests:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-review-receiver:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-review-analyzer:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-reviews-projection:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-review-activator:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-fraudster-handler:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-notification-dispatcher:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-telegram-sender:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-email-sender:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-support-tickets:
    profiles: [docker-dev]
    environment:
      <<: *dev-env

  worker-rate-limiter-cleanup:
    profiles: [docker-dev]
    environment:
      <<: *dev-env
