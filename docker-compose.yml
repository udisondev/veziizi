x-backend: &backend
  image: veziizi/backend
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    container_name: veziizi-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veziizi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: veziizi-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]

  frontend:
    image: veziizi/frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  telegram-bot:
    <<: *backend
    command: ["telegram-bot"]

  # forwarder — единственный потребитель Postgres outbox, перекладывает события
  # в Redis Streams. Всегда РОВНО ОДИН инстанс (не масштабировать).
  worker-forwarder:
    <<: *backend
    command: ["worker-forwarder"]

  worker-members:
    <<: *backend
    command: ["worker-members"]

  worker-invitations:
    <<: *backend
    command: ["worker-invitations"]

  worker-pending-organizations:
    <<: *backend
    command: ["worker-pending-organizations"]

  worker-organizations:
    <<: *backend
    command: ["worker-organizations"]

  worker-freight-requests:
    <<: *backend
    command: ["worker-freight-requests"]

  worker-review-receiver:
    <<: *backend
    command: ["worker-review-receiver"]

  worker-review-analyzer:
    <<: *backend
    command: ["worker-review-analyzer"]

  worker-reviews-projection:
    <<: *backend
    command: ["worker-reviews-projection"]

  worker-review-activator:
    <<: *backend
    command: ["worker-review-activator"]

  worker-fraudster-handler:
    <<: *backend
    command: ["worker-fraudster-handler"]

  worker-notification-dispatcher:
    <<: *backend
    command: ["worker-notification-dispatcher"]

  worker-telegram-sender:
    <<: *backend
    command: ["worker-telegram-sender"]

  worker-email-sender:
    <<: *backend
    command: ["worker-email-sender"]

  worker-support-tickets:
    <<: *backend
    command: ["worker-support-tickets"]

  worker-support-tickets-notifier:
    <<: *backend
    command: ["worker-support-tickets-notifier"]

  worker-vehicles:
    <<: *backend
    command: ["worker-vehicles"]

  worker-rate-limiter-cleanup:
    <<: *backend
    command: ["worker-rate-limiter-cleanup"]

  worker-dedup-cleanup:
    <<: *backend
    command: ["worker-dedup-cleanup"]

volumes:
  postgres_data:
  redis_data:
